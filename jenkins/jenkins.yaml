jenkins:
  systemMessage: "FFIT Jenkins"

  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: ${JEDI_USERNAME}
          password: ${JEDI_PASSWORD}
        - id: ${PADAWAN_USERNAME}
          password: ${PADAWAN_PASSWORD}

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: admin
            permissions:
              - Overall/Administer
            entries:
              - user: ${JEDI_USERNAME}

          - name: student
            permissions:
              - Overall/Read
              - Job/Read
              - Job/Build
              - Job/Configure
              - Job/Create
              - Job/Delete
            entries:
              - user: ${PADAWAN_USERNAME}

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: sonar-token
              scope: GLOBAL
              secret: "${SONAR_TOKEN}"

unclassified:
  sonarGlobalConfiguration:
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000/sonarqube"
        credentialsId: "sonar-token"

tool:
  sonarRunnerInstallation:
    installations:
      - name: "sonar-scanner"
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "5.0.1.3006"
